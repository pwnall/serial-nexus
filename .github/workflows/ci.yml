name: CI

# Least privilege, declared once at the top: this workflow only reads the tree and
# uploads build artifacts — it never writes to the repository, issues, releases or
# packages. Without this block the default token scope applies, which is far wider
# than anything here needs. A job that ever needs more may widen it locally.
permissions:
  contents: read

on:
  push:
  pull_request:
  # The nightly lane on demand, from the Actions tab or `gh workflow run CI --ref <ref>`.
  # Without this the only way to exercise a soak, the include-ignored sweep or the fuzz
  # battery against a given commit was to wait for 06:00 UTC — and the nightlies run
  # against the default branch's own ref, so a fix sitting on a branch could not be
  # nightly-tested at all before it landed. That is backwards for exactly the changes
  # these lanes exist to catch.
  workflow_dispatch:
  schedule:
    # Nightly lane (§Phase 8): the longer soak, the full include-ignored sweep, and
    # the fuzz battery — too slow for every push. 06:00 UTC daily.
    - cron: '0 6 * * *'

# One in-flight run per (trigger, ref): a superseded push cancels its own predecessor
# instead of burning a runner to finish testing a commit nobody will look at — the
# macOS lane especially. `github.event_name` is part of the key, and cancellation is
# disabled for `schedule`, ON PURPOSE: the nightlies run against the default branch's
# own ref, so a key shared with pushes plus a blanket `cancel-in-progress` would let an
# ordinary push kill a soak/sweep/fuzz run halfway and lose that night's coverage
# silently. Nightlies are a day apart and never overlap, so their group never queues.
#
# `workflow_dispatch` is exempt for the same reason and no other: a manual run carries
# the same half-hour soak, and someone who clicks twice — or dispatches a second ref
# while the first is still going — should not silently lose the run they are waiting on.
# The event name is in the group key, so a dispatch is already safe from being cancelled
# by a push; this covers dispatch-versus-dispatch. The cost is that a mistaken manual run
# has to be cancelled by hand rather than superseded, which is the right trade for a lane
# whose whole value is that it finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

# Toolchain policy: EVERY job that compiles repo code pins the MSRV, from this one
# variable. AGENTS.md invariant 6 makes 1.97 a *two-way* constraint — the sources need
# ≥1.88 for let-chains, and clippy 0.1.97's `collapsible_if` *requires* the let-chain
# collapse that older clippy rejects — so a job floating on `stable` proves nothing
# about the MSRV and can fail on a lint the pinned toolchain does not even have.
# Bump MSRV here in lockstep with the workspace Cargo.toml `rust-version`.
# `fuzz-nightly` is the one deliberate exception: cargo-fuzz requires nightly.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: '1.97'
  # Tool versions are pinned, not floated: `--locked` pins a tool's dependency graph,
  # never the tool itself, so an unpinned `cargo install` silently upgrades across
  # majors — and cargo-deny has broken `deny.toml` schema compatibility across majors
  # before, which would fail this repo's gate for a reason that is not this repo's.
  # Safe to pin here because CI runs `cargo deny check licenses bans sources` and NOT
  # `advisories`, so a pinned binary does not freeze any advisory data.
  CARGO_DENY_VERSION: '0.19.9'
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  # Unprivileged lane: builds, lints, and the WHOLE test suite — unit + property
  # tests AND the serial-nexus-itest integration harness (design §5), which boots
  # serial-nexus-daemon/serial-nexus-sim/serial-nexus-web as subprocesses and drives them over the
  # control socket. The harness's bin() lookups resolve `target/debug/<name>`, which
  # ONLY `cargo build` produces — `cargo test` builds the test-instrumented bins under
  # `deps/`, not the plain artifact — so an explicit `cargo build --workspace` MUST
  # precede the test step (matching AGENTS.md §3's documented local flow). The
  # exec/envelope codec tests shell out to python3, which the runner image provides.
  # Runs on every push (§3). MSRV is pinned to the development toolchain (the code uses
  # let-chains freely); bump the `MSRV` env above in lockstep with Cargo.toml.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal --component rustfmt,clippy
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The minimal daemon build §8 supports (every built-in codec dropped) must
      # also be warning-clean — the registry-as-value path is easy to leave with an
      # unused binding when no codec is registered.
      - name: Clippy (minimal daemon, no built-in codecs)
        run: cargo clippy -p serial-nexus-daemon-bin -p serial-nexus-daemon --no-default-features --locked -- -D warnings
      # **A `#[cfg(target_os = "linux")]` mistake in test code is invisible to every
      # step above it and to the macOS lane's own first step.** `cargo build` compiles
      # no test target, so an ungated test helper referring to a gated type builds
      # clean everywhere and reddens only `cargo test`/`cargo clippy --all-targets`,
      # and only off Linux — which puts the failure in the one lane that runs last and
      # blames it on the platform (notes §3.71).
      #
      # This is the **second** recorded macOS-only compile break and the first of its
      # shape. §3.65 A was the first: `serial-nexus-devprep` was an unconditional
      # workspace member using a Linux-only symbol. That one at least reddened
      # `cargo build --workspace`, the macOS lane's own first step. This one does not
      # — `cargo build` compiles no test target — which is why a *new* instrument was
      # needed rather than a second reading of the old one.
      # A compile-only cross-check is the cheapest instrument that sees the class:
      # `check` does not link, needs no Apple SDK, and costs one rustup std download.
      #
      # **BOTH Apple triples, and that is measured rather than belt-and-braces.**
      # Neither target is a superset of the other, proved by planting a defect in each
      # direction inside a `#[cfg(target_os = "macos")]` module and running both
      # (notes §3.71):
      #
      #   plant                          x86_64 check   aarch64 check
      #   x86-only intrinsic             PASSES         caught (E0433)
      #   aarch64-only NEON type         caught (E0433) PASSES
      #
      # So each triple catches exactly the arch-specific code written on the *other*
      # architecture — the same mistake as this session's, one axis over: reaching for
      # `target_os` when the code is really `target_arch`. That is a live risk here and
      # not a hypothetical: `macos-latest` is arm64, the bench rig is an Intel Mac, and
      # `sys/src/usb_macos.rs` is hand-written FFI in the one crate allowed `unsafe`.
      # There are zero `target_arch` hits in the tree today; this keeps it that way
      # cheaply instead of discovering the first one from a support report.
      #
      # **Say what this does NOT cover (§9).** `serial-nexus-web` is excluded because
      # its TLS stack pulls `ring`, whose build script needs a real Apple C toolchain
      # — `cc` on a Linux runner rejects `-arch arm64` outright, so the step would be
      # red for a reason that is not a defect. That is the same exclusion AGENTS.md §3
      # already names for the by-hand macOS cross-check, and it means a stolen cfg
      # inside `web`'s own test code still reaches only the macOS lane. Every other
      # crate — including `daemon`, where both recorded instances landed — is covered.
      - name: Cross-check macOS test targets compile (catches stolen cfg attributes)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo check --target "$t" --workspace --exclude serial-nexus-web \
              --all-targets --locked
          done
      # `cargo test` does NOT emit `target/debug/serial-nexus-daemon` (only the deps/ test
      # bins); the serial-nexus-itest harness boots that plain artifact, so build it first.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Test (unit + property + serial-nexus-itest integration harness)
        run: cargo test --workspace --locked

  # The licensing gate proven, not assumed (§13). cargo-deny plus the serial-nexus-itest test
  # that proves the gate rejects a banned crate (§16.11 folded the bash script into it;
  # it self-skips where cargo-deny is absent, so this job — which installs it — is where
  # it runs for real). The job compiles repo code (that serial-nexus-itest test), so it pins the
  # MSRV like every other compiling job, and it caches: without `rust-cache` it rebuilt
  # cargo-deny from source on every single push.
  license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: License and ban check
        run: cargo deny check licenses bans sources
      # `SNX_LICENSE_GATE=required` turns the gate's self-skip into a failure, the same
      # shape `SNX_WEB_UI=required` gives the browser gate. This is the job that
      # provisions both prerequisites the gate needs — cargo-deny above, and a network
      # that can resolve the planted crate — so a skip *here* is a gate CI passes over a
      # hole (plan §3 rule 7), not a laptop without the tool.
      - name: Prove the gate rejects a banned crate
        env:
          SNX_LICENSE_GATE: required
        run: cargo test -p serial-nexus-itest --test p0_license_gate --locked

  # Capability report (design §15.17): run every probe on the runner, assert the
  # platform expectation, and archive the Markdown so every capability claim has a
  # dated report behind it. `skipped(no adapter)` is a valid CI verdict. (The
  # no-unsupported assertion is ALSO covered by serial-nexus-itest tests/meta_gates.rs; this
  # job additionally archives the human report.)
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Capability report
        run: |
          # ONE run, both consumers (plan §18 item 43). `--json-out` writes the JSON twin
          # of the same `Report` the Markdown renders, so the gate reads the report that
          # was archived rather than a second measurement of the same box — P9's and P10's
          # numbers move run to run, which is why the era diffs take three samples
          # (notes §3.74).
          #
          # **Not `| tee`.** The doctor exits **1** when any probe reports `unsupported`
          # (`report.any_unsupported()`) and **2** when it could not produce a report at
          # all — and in a pipeline the step's status is the LAST command's, so `tee`
          # returning 0 discarded both. That is the `jq -e` defect in a second costume
          # (AGENTS §3): a command that reads as a gate and cannot fail the lane on its
          # own account. Redirect, so the exit status is the command's (notes §3.77).
          #
          # This job has no separate build step — `cargo run` is the build — so it stays
          # `cargo run`; the macOS lane runs the artifact its own build step produced.
          cargo run -q --locked -p serial-nexus-doctor -- --markdown \
              --json-out serial-nexus-doctor-report.json > serial-nexus-doctor-report.md
          jq -e -f expectations/linux.jq serial-nexus-doctor-report.json
      # **Both renderings, because only one of them is the artifact of record.** The
      # Markdown is for reading; the JSON is the only form the gate and the field-set
      # recompute can read, and the only one that records whether a value is a number,
      # a string or a boolean (notes §3.74). Uploading only the Markdown wrote the twin
      # and then threw it away at the end of every run — which is the half plan §18
      # items 8 and 18 are owed captures of.
      - uses: actions/upload-artifact@v5
        with:
          name: serial-nexus-doctor-report
          path: |
            serial-nexus-doctor-report.md
            serial-nexus-doctor-report.json

  # Out-of-tree codec template (§15.26 / plan §10.3): build the out-of-tree stand-in
  # from the CONSUMER's own position (its own workspace manifest, path deps standing
  # in for version pins), run its conformance-kit test, and prove the custom daemon
  # serves its `acme` codec alongside the built-ins. §16.11 folded the bash script into
  # serial-nexus-itest tests/p8_external_codec.rs, which now builds the excluded template itself
  # (the `check` job's `cargo test --workspace` also exercises it; this job keeps an
  # isolated signal for the embedding pattern — a consumer building against the MSRV).
  external-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Build and exercise the out-of-tree template
        run: cargo test -p serial-nexus-itest --test p8_external_codec --locked

  # macOS is best-effort (design §13). Now that the PTY node works on macOS (§7.2
  # slave-termios) and the harness is portable Rust, the macOS lane runs the SAME
  # `cargo test --workspace` as Linux: the serial-*device* tests self-skip (a pty is
  # not a serial device on macOS — serial2 → ENOTTY), while control-plane, pty,
  # codec, exec, leg, tap, and web tests all run. The doctor macos.jq gate is now a
  # REAL gate (P2 is `degraded`, not `unsupported`). Deltas documented in docs/macos.md.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: brew install jq
      # As on Linux: `cargo test` never emits the plain `target/debug/serial-nexus-daemon`
      # the serial-nexus-itest harness boots — build the workspace bins first.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      # `--no-fail-fast` here and not on the Linux lane, because this is the lane nobody
      # runs before pushing. `cargo test --workspace` stops at the first failing test
      # BINARY, so a red macOS job reports one crate and says nothing about the 80-odd
      # targets behind it — which is exactly how one failing unit test hid three more for
      # six consecutive pushes (docs/macos.md, the 2026-07-28 block). The lesson was
      # written down then and never reached this file; a job that is going to be red
      # anyway costs nothing by being red *completely*.
      - name: Build + test (portable core + integration harness; serial tests self-skip)
        run: cargo test --workspace --locked --no-fail-fast
      - name: Capability report + macos.jq gate
        run: |
          # **This step had not executed in any recent run.** Every macOS run since at
          # least 2026-08-10 failed at the test step above, and a failed step skips the
          # rest of the job — so the macOS jq gate AGENTS §3 names as the one this lane
          # gates on was not running at all. The first execution, 2026-08-12, could not
          # exec the doctor binary (`cannot execute binary file`) after `cargo build
          # --workspace` had just built it and the harness had just run other binaries
          # from the same directory. The diagnostic below is here to say why rather
          # than let the next reader guess; it is cheap and it prints before the gate,
          # so a green run carries the evidence too (notes §3.77).
          uname -m; sw_vers || true
          ls -la target/debug/serial-nexus-doctor || true
          file target/debug/serial-nexus-doctor || true
          # One run, both consumers — the Linux lane's reasoning, verbatim (plan §18 item 43).
          # `cargo build` above already produced it, so run the artifact directly: the
          # extra `cargo run` resolve is what the pipeline's exit status was hiding.
          ./target/debug/serial-nexus-doctor --markdown \
              --json-out serial-nexus-doctor-macos.json > serial-nexus-doctor-macos.md
          jq -e -f expectations/macos.jq serial-nexus-doctor-macos.json
      # Both renderings — the Linux lane's reasoning, verbatim (notes §3.74).
      - uses: actions/upload-artifact@v5
        with:
          name: serial-nexus-doctor-macos-report
          path: |
            serial-nexus-doctor-macos.md
            serial-nexus-doctor-macos.json

  # The web console's browser half, in real headless Chromium (design §15.37, plan §15).
  # §16.7's doctrine only allows a behavior the sim cannot exercise to be checklist-
  # verified or marked unverified — and a checklist does not run per push, which is what
  # left the OPFS splice, the epoch re-anchor and the editor flows unasserted where they
  # actually run. This job provisions node plus the pinned Chromium and runs the two
  # gates that need a JS runtime: `p8_web_ui`, which boots the daemon + sim fixture and
  # hands a pinned Playwright suite a bootstrap URL, and `p8_web_history`, which runs the
  # pure browser modules under `node --test`.
  #
  # `SNX_WEB_UI=required` is the point of the job: both gates self-skip when node or the
  # browser is missing (so a developer's `cargo test --workspace` is unaffected, and the
  # `check` job above skips them), and this variable turns every one of those skips into a
  # failure. Without it the job could go green having run nothing — the same shape as the
  # fuzz loop that ran a stale list (§15.36 rule 7). `p8_web_ui` additionally asserts a
  # floor on the number of specs that passed — a different floor per fixture, one for the
  # with-device arm and one for the device-free arm — and that nothing skipped itself when
  # a device was present. The two numbers are deliberately NOT repeated here: they live as
  # `SPECS_WITH_DEVICE` / `SPECS_DEVICE_FREE` in `itest/tests/p8_web_ui.rs`, next to the
  # spec recount that justifies them, because this comment carried "19 with a serial
  # device, 10 device-free" against constants that had since become 22 and 12 — a lane
  # description drifting from the gate it describes is exactly what naming the constants
  # instead of copying their values prevents.
  #
  # `@slow` specs (today two, both in `console.spec.mjs`: the forced tap shed, and the
  # unwatched-console tap release whose subject is the grace interval itself) are excluded
  # here and run in the nightly lane below — Playwright's spelling of this repo's
  # `#[ignore]` convention.
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui-tests/package-lock.json
      # `npm ci` installs exactly the committed lockfile — the dev-time dependency tree
      # is pinned like every other tool version in this file (§15.37: "the browser and
      # package versions are pinned").
      - name: Install the pinned Playwright package
        working-directory: web/ui-tests
        run: npm ci
      # Keyed on the lockfile, because the browser build Playwright wants is a function
      # of the Playwright version. A miss costs the ~115 MiB download once.
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: web/ui-tests
        run: npx playwright install --with-deps chromium
      # The gate boots the plain `target/debug/{serial-nexus-daemon,serial-nexus-sim,serial-nexus-web}`
      # artifacts, which only `cargo build` emits (see the `check` job).
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite
        env:
          SNX_WEB_UI: required
        run: cargo test -p serial-nexus-itest --test p8_web_ui --locked
      # The browser console's *pure* modules (`history.mjs`, `saver.mjs`, `ansi.mjs`,
      # `graph.mjs`) under `node --test`. It runs in the `check` job too, but there it
      # self-skips when the image ships no node — invisibly, because libtest captures a
      # passing test's stderr (review 32 TESTR-6). This is the job that provisions node,
      # so this is the job that can make the skip a failure.
      - name: Browser console modules (node --test)
        env:
          SNX_WEB_UI: required
        run: cargo test -p serial-nexus-itest --test p8_web_history --locked
      # Traces and screenshots for a failing spec (§15.37). `if: failure()` so a green
      # run uploads nothing.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: web/ui-tests/test-results
          retention-days: 7

  # Nightly soak (§Phase 8 item 2): the reference-topology data plane under sustained
  # synthetic load, asserting bounded RSS, allowlisted counters, zero faults, and a
  # final checksum reconciliation. The `#[ignore]`d endurance test, parameterized by
  # the same SOAK_* env knobs the bash used. A true 24-hour soak runs on dedicated
  # hardware before a release; CI runs a bounded slice.
  soak-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # p8_soak boots serial-nexus-daemon + serial-nexus-sim; `cargo test -p serial-nexus-itest` would not
      # produce those plain artifacts, so build the workspace bins first.
      - name: Build workspace binaries (soak boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Soak (30 minutes)
        env:
          SOAK_SECONDS: '1800'
          SOAK_INTERVAL: '30'
        run: cargo test -p serial-nexus-itest --locked --test p8_soak -- --ignored --nocapture

  # Nightly full sweep (post-1.0 §9.5, design §16.5): the complete suite INCLUDING the
  # #[ignore]d endurance/heavy tests — "a validation suite that only runs on the
  # author's machine is a reliability claim on the honor system." Now just the Rust
  # suite with ignored tests included; the exit code is the verdict.
  sweep-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # `cargo test` never emits the plain workspace bins the serial-nexus-itest harness boots.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Full suite including ignored (endurance/heavy)
        run: cargo test --workspace --locked -- --include-ignored

  # Nightly browser lane: the same gate with the `@slow` specs included — today two, both
  # in `console.spec.mjs`. The forced tap shed drowns the renderer on purpose and takes
  # about a minute of real browser time to surface the counter it is asserting; the
  # unwatched-console tap release waits out the shipped grace interval twice, because that
  # interval is the thing under test and shortening it would assert a timer this product
  # does not ship. Playwright's spelling of the `#[ignore]` + nightly-sweep convention the
  # Rust suite already uses.
  web-ui-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui-tests/package-lock.json
      - name: Install the pinned Playwright package
        working-directory: web/ui-tests
        run: npm ci
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: web/ui-tests
        run: npx playwright install --with-deps chromium
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite, slow specs included
        env:
          SNX_WEB_UI: required
          SNX_UI_SLOW: '1'
        run: cargo test -p serial-nexus-itest --test p8_web_ui --locked
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-nightly
          path: web/ui-tests/test-results
          retention-days: 7

  # Nightly fuzzing (§Phase 8, widened by review 26 SEC-7): every parser on an
  # externally-reachable surface, on top of the existing proptest coverage. Needs a
  # nightly toolchain and libFuzzer — the one job that does NOT pin the MSRV.
  fuzz-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # cargo-fuzz has no `--locked` flag of its own (checked: 0.13.2 `build`/`run`),
      # so the committed fuzz/Cargo.lock is asserted here instead — a drifted lock must
      # fail loudly rather than be regenerated in silence. `fetch` also warms the deps
      # the build below needs.
      - name: Verify fuzz/Cargo.lock is current (cargo-fuzz takes no --locked)
        working-directory: fuzz
        run: cargo +nightly fetch --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      # The target list comes from cargo-fuzz itself, never a hand-maintained copy:
      # the literal list this replaced named four targets while `fuzz build` above
      # built nine, so the five parsers added to close review-26 SEC-7 (the control
      # socket's front door, the tap.data base64 codec, GraphConfig deserialize +
      # validate, RequestLines, and the web HTTP head parser) were compiled every
      # night and fuzzed never. A target added under fuzz/fuzz_targets/ is now fuzzed
      # the night it lands. The empty-list guard matters for the same reason: a
      # silently empty loop is exactly the failure mode being fixed, and it must not
      # be able to report green.
      - name: Fuzz every target briefly
        working-directory: fuzz
        run: |
          targets="$(cargo +nightly fuzz list)"
          echo "targets: $targets"
          test -n "$targets"
          for t in $targets; do
            echo "=== fuzzing $t ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
