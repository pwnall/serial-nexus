name: CI

# Least privilege, declared once at the top: this workflow only reads the tree and
# uploads build artifacts — it never writes to the repository, issues, releases or
# packages. Without this block the default token scope applies, which is far wider
# than anything here needs. A job that ever needs more may widen it locally.
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    # Nightly lane (§Phase 8): the longer soak, the full include-ignored sweep, and
    # the fuzz battery — too slow for every push. 06:00 UTC daily.
    - cron: '0 6 * * *'

# One in-flight run per (trigger, ref): a superseded push cancels its own predecessor
# instead of burning a runner to finish testing a commit nobody will look at — the
# macOS lane especially. `github.event_name` is part of the key, and cancellation is
# disabled for `schedule`, ON PURPOSE: the nightlies run against the default branch's
# own ref, so a key shared with pushes plus a blanket `cancel-in-progress` would let an
# ordinary push kill a soak/sweep/fuzz run halfway and lose that night's coverage
# silently. Nightlies are a day apart and never overlap, so their group never queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Toolchain policy: EVERY job that compiles repo code pins the MSRV, from this one
# variable. AGENTS.md invariant 6 makes 1.97 a *two-way* constraint — the sources need
# ≥1.88 for let-chains, and clippy 0.1.97's `collapsible_if` *requires* the let-chain
# collapse that older clippy rejects — so a job floating on `stable` proves nothing
# about the MSRV and can fail on a lint the pinned toolchain does not even have.
# Bump MSRV here in lockstep with the workspace Cargo.toml `rust-version`.
# `fuzz-nightly` is the one deliberate exception: cargo-fuzz requires nightly.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: '1.97'
  # Tool versions are pinned, not floated: `--locked` pins a tool's dependency graph,
  # never the tool itself, so an unpinned `cargo install` silently upgrades across
  # majors — and cargo-deny has broken `deny.toml` schema compatibility across majors
  # before, which would fail this repo's gate for a reason that is not this repo's.
  # Safe to pin here because CI runs `cargo deny check licenses bans sources` and NOT
  # `advisories`, so a pinned binary does not freeze any advisory data.
  CARGO_DENY_VERSION: '0.19.9'
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  # Unprivileged lane: builds, lints, and the WHOLE test suite — unit + property
  # tests AND the nexus-itest integration harness (design §5), which boots
  # serialnexusd/nexus-sim/serialnexusweb as subprocesses and drives them over the
  # control socket. The harness's bin() lookups resolve `target/debug/<name>`, which
  # ONLY `cargo build` produces — `cargo test` builds the test-instrumented bins under
  # `deps/`, not the plain artifact — so an explicit `cargo build --workspace` MUST
  # precede the test step (matching AGENTS.md §4's documented local flow). The
  # exec/envelope codec tests shell out to python3, which the runner image provides.
  # Runs on every push (§3). MSRV is pinned to the development toolchain (the code uses
  # let-chains freely); bump the `MSRV` env above in lockstep with Cargo.toml.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal --component rustfmt,clippy
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The minimal daemon build §8 supports (every built-in codec dropped) must
      # also be warning-clean — the registry-as-value path is easy to leave with an
      # unused binding when no codec is registered.
      - name: Clippy (minimal daemon, no built-in codecs)
        run: cargo clippy -p serialnexusd -p nexus-daemon --no-default-features --locked -- -D warnings
      # `cargo test` does NOT emit `target/debug/serialnexusd` (only the deps/ test
      # bins); the nexus-itest harness boots that plain artifact, so build it first.
      - name: Build workspace binaries (nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Test (unit + property + nexus-itest integration harness)
        run: cargo test --workspace --locked

  # The licensing gate proven, not assumed (§13). cargo-deny plus the nexus-itest test
  # that proves the gate rejects a banned crate (§16.11 folded the bash script into it;
  # it self-skips where cargo-deny is absent, so this job — which installs it — is where
  # it runs for real). The job compiles repo code (that nexus-itest test), so it pins the
  # MSRV like every other compiling job, and it caches: without `rust-cache` it rebuilt
  # cargo-deny from source on every single push.
  license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: License and ban check
        run: cargo deny check licenses bans sources
      # `SNX_LICENSE_GATE=required` turns the gate's self-skip into a failure, the same
      # shape `SNX_WEB_UI=required` gives the browser gate. This is the job that
      # provisions both prerequisites the gate needs — cargo-deny above, and a network
      # that can resolve the planted crate — so a skip *here* is a gate CI passes over a
      # hole (plan §3 rule 7), not a laptop without the tool.
      - name: Prove the gate rejects a banned crate
        env:
          SNX_LICENSE_GATE: required
        run: cargo test -p nexus-itest --test p0_license_gate --locked

  # Capability report (design §15.17): run every probe on the runner, assert the
  # platform expectation, and archive the Markdown so every capability claim has a
  # dated report behind it. `skipped(no adapter)` is a valid CI verdict. (The
  # no-unsupported assertion is ALSO covered by nexus-itest tests/meta_gates.rs; this
  # job additionally archives the human report.)
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Capability report
        run: |
          cargo run -q --locked -p nexus-doctor -- --markdown | tee nexus-doctor-report.md
          cargo run -q --locked -p nexus-doctor -- --json | jq -e -f expectations/linux.jq
      - uses: actions/upload-artifact@v5
        with:
          name: nexus-doctor-report
          path: nexus-doctor-report.md

  # Out-of-tree codec template (§15.26 / plan §10.3): build the closed-repo stand-in
  # from the CONSUMER's own position (its own workspace manifest, path deps standing
  # in for version pins), run its conformance-kit test, and prove the custom daemon
  # serves its `acme` codec alongside the built-ins. §16.11 folded the bash script into
  # nexus-itest tests/p8_external_codec.rs, which now builds the excluded template itself
  # (the `check` job's `cargo test --workspace` also exercises it; this job keeps an
  # isolated signal for the embedding pattern — a consumer building against the MSRV).
  external-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Build and exercise the out-of-tree template
        run: cargo test -p nexus-itest --test p8_external_codec --locked

  # macOS is best-effort (design §13). Now that the PTY node works on macOS (§7.2
  # slave-termios) and the harness is portable Rust, the macOS lane runs the SAME
  # `cargo test --workspace` as Linux: the serial-*device* tests self-skip (a pty is
  # not a serial device on macOS — serial2 → ENOTTY), while control-plane, pty,
  # codec, exec, leg, tap, and web tests all run. The doctor macos.jq gate is now a
  # REAL gate (P2 is `degraded`, not `unsupported`). Deltas documented in docs/macos.md.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: brew install jq
      # As on Linux: `cargo test` never emits the plain `target/debug/serialnexusd`
      # the nexus-itest harness boots — build the workspace bins first.
      - name: Build workspace binaries (nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Build + test (portable core + integration harness; serial tests self-skip)
        run: cargo test --workspace --locked
      - name: Capability report + macos.jq gate
        run: |
          cargo run -q --locked -p nexus-doctor -- --markdown | tee nexus-doctor-macos.md
          cargo run -q --locked -p nexus-doctor -- --json | jq -e -f expectations/macos.jq
      - uses: actions/upload-artifact@v5
        with:
          name: nexus-doctor-macos-report
          path: nexus-doctor-macos.md

  # The web console's browser half, in real headless Chromium (design §15.37, plan §15).
  # §16.7's doctrine only allows a behavior the sim cannot exercise to be checklist-
  # verified or marked unverified — and a checklist does not run per push, which is what
  # left the OPFS splice, the epoch re-anchor and the editor flows unasserted where they
  # actually run. This job provisions node plus the pinned Chromium and runs the two
  # gates that need a JS runtime: `p8_web_ui`, which boots the daemon + sim fixture and
  # hands a pinned Playwright suite a bootstrap URL, and `p8_web_history`, which runs the
  # pure browser modules under `node --test`.
  #
  # `SNX_WEB_UI=required` is the point of the job: both gates self-skip when node or the
  # browser is missing (so a developer's `cargo test --workspace` is unaffected, and the
  # `check` job above skips them), and this variable turns every one of those skips into a
  # failure. Without it the job could go green having run nothing — the same shape as the
  # fuzz loop that ran a stale list (§15.36 rule 7). `p8_web_ui` additionally asserts a
  # floor on the number of specs that passed — the count for the fixture it actually built
  # (19 with a serial device, 10 device-free) — and that nothing skipped itself when a
  # device was present.
  #
  # `@slow` specs (today: the forced tap shed, which costs a minute of real renderer
  # time) are excluded here and run in the nightly lane below — Playwright's spelling of
  # this repo's `#[ignore]` convention.
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serialnexusweb/ui-tests/package-lock.json
      # `npm ci` installs exactly the committed lockfile — the dev-time dependency tree
      # is pinned like every other tool version in this file (§15.37: "the browser and
      # package versions are pinned").
      - name: Install the pinned Playwright package
        working-directory: serialnexusweb/ui-tests
        run: npm ci
      # Keyed on the lockfile, because the browser build Playwright wants is a function
      # of the Playwright version. A miss costs the ~115 MiB download once.
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('serialnexusweb/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: serialnexusweb/ui-tests
        run: npx playwright install --with-deps chromium
      # The gate boots the plain `target/debug/{serialnexusd,nexus-sim,serialnexusweb}`
      # artifacts, which only `cargo build` emits (see the `check` job).
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite
        env:
          SNX_WEB_UI: required
        run: cargo test -p nexus-itest --test p8_web_ui --locked
      # The browser console's *pure* modules (`history.mjs`, `saver.mjs`, `ansi.mjs`,
      # `graph.mjs`) under `node --test`. It runs in the `check` job too, but there it
      # self-skips when the image ships no node — invisibly, because libtest captures a
      # passing test's stderr (review 32 TESTR-6). This is the job that provisions node,
      # so this is the job that can make the skip a failure.
      - name: Browser console modules (node --test)
        env:
          SNX_WEB_UI: required
        run: cargo test -p nexus-itest --test p8_web_history --locked
      # Traces and screenshots for a failing spec (§15.37). `if: failure()` so a green
      # run uploads nothing.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: serialnexusweb/ui-tests/test-results
          retention-days: 7

  # Nightly soak (§Phase 8 item 2): the reference-topology data plane under sustained
  # synthetic load, asserting bounded RSS, allowlisted counters, zero faults, and a
  # final checksum reconciliation. The `#[ignore]`d endurance test, parameterized by
  # the same SOAK_* env knobs the bash used. A true 24-hour soak runs on dedicated
  # hardware before a release; CI runs a bounded slice.
  soak-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # p8_soak boots serialnexusd + nexus-sim; `cargo test -p nexus-itest` would not
      # produce those plain artifacts, so build the workspace bins first.
      - name: Build workspace binaries (soak boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Soak (30 minutes)
        env:
          SOAK_SECONDS: '1800'
          SOAK_INTERVAL: '30'
        run: cargo test -p nexus-itest --locked --test p8_soak -- --ignored --nocapture

  # Nightly full sweep (post-1.0 §9.5, design §16.5): the complete suite INCLUDING the
  # #[ignore]d endurance/heavy tests — "a validation suite that only runs on the
  # author's machine is a reliability claim on the honor system." Now just the Rust
  # suite with ignored tests included; the exit code is the verdict.
  sweep-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # `cargo test` never emits the plain workspace bins the nexus-itest harness boots.
      - name: Build workspace binaries (nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Full suite including ignored (endurance/heavy)
        run: cargo test --workspace --locked -- --include-ignored

  # Nightly browser lane: the same gate with the `@slow` specs included — today the
  # forced tap shed, which drowns the renderer on purpose and therefore takes about a
  # minute of real browser time to surface the counter it is asserting. Playwright's
  # spelling of the `#[ignore]` + nightly-sweep convention the Rust suite already uses.
  web-ui-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serialnexusweb/ui-tests/package-lock.json
      - name: Install the pinned Playwright package
        working-directory: serialnexusweb/ui-tests
        run: npm ci
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('serialnexusweb/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: serialnexusweb/ui-tests
        run: npx playwright install --with-deps chromium
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite, slow specs included
        env:
          SNX_WEB_UI: required
          SNX_UI_SLOW: '1'
        run: cargo test -p nexus-itest --test p8_web_ui --locked
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-nightly
          path: serialnexusweb/ui-tests/test-results
          retention-days: 7

  # Nightly fuzzing (§Phase 8, widened by review 26 SEC-7): every parser on an
  # externally-reachable surface, on top of the existing proptest coverage. Needs a
  # nightly toolchain and libFuzzer — the one job that does NOT pin the MSRV.
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # cargo-fuzz has no `--locked` flag of its own (checked: 0.13.2 `build`/`run`),
      # so the committed fuzz/Cargo.lock is asserted here instead — a drifted lock must
      # fail loudly rather than be regenerated in silence. `fetch` also warms the deps
      # the build below needs.
      - name: Verify fuzz/Cargo.lock is current (cargo-fuzz takes no --locked)
        working-directory: fuzz
        run: cargo +nightly fetch --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      # The target list comes from cargo-fuzz itself, never a hand-maintained copy:
      # the literal list this replaced named four targets while `fuzz build` above
      # built nine, so the five parsers added to close review-26 SEC-7 (the control
      # socket's front door, the tap.data base64 codec, GraphConfig deserialize +
      # validate, RequestLines, and the web HTTP head parser) were compiled every
      # night and fuzzed never. A target added under fuzz/fuzz_targets/ is now fuzzed
      # the night it lands. The empty-list guard matters for the same reason: a
      # silently empty loop is exactly the failure mode being fixed, and it must not
      # be able to report green.
      - name: Fuzz every target briefly
        working-directory: fuzz
        run: |
          targets="$(cargo +nightly fuzz list)"
          echo "targets: $targets"
          test -n "$targets"
          for t in $targets; do
            echo "=== fuzzing $t ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
