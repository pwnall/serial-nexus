name: CI

# Least privilege, declared once at the top: this workflow only reads the tree and
# uploads build artifacts — it never writes to the repository, issues, releases or
# packages. Without this block the default token scope applies, which is far wider
# than anything here needs. A job that ever needs more may widen it locally.
permissions:
  contents: read

on:
  push:
  pull_request:
  # The nightly lane on demand, from the Actions tab or `gh workflow run CI --ref <ref>`.
  # Without this the only way to exercise a soak, the include-ignored sweep or the fuzz
  # battery against a given commit was to wait for 06:00 UTC — and the nightlies run
  # against the default branch's own ref, so a fix sitting on a branch could not be
  # nightly-tested at all before it landed. That is backwards for exactly the changes
  # these lanes exist to catch.
  workflow_dispatch:
  schedule:
    # Nightly lane (§Phase 8): the longer soak, the full include-ignored sweep, and
    # the fuzz battery — too slow for every push. 06:00 UTC daily.
    - cron: '0 6 * * *'

# One in-flight run per (trigger, ref): a superseded push cancels its own predecessor
# instead of burning a runner to finish testing a commit nobody will look at — the
# macOS lane especially. `github.event_name` is part of the key, and cancellation is
# disabled for `schedule`, ON PURPOSE: the nightlies run against the default branch's
# own ref, so a key shared with pushes plus a blanket `cancel-in-progress` would let an
# ordinary push kill a soak/sweep/fuzz run halfway and lose that night's coverage
# silently. Nightlies are a day apart and never overlap, so their group never queues.
#
# `workflow_dispatch` is exempt for the same reason and no other: a manual run carries
# the same half-hour soak, and someone who clicks twice — or dispatches a second ref
# while the first is still going — should not silently lose the run they are waiting on.
# The event name is in the group key, so a dispatch is already safe from being cancelled
# by a push; this covers dispatch-versus-dispatch. The cost is that a mistaken manual run
# has to be cancelled by hand rather than superseded, which is the right trade for a lane
# whose whole value is that it finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

# Toolchain policy: EVERY job that compiles repo code pins the MSRV, from this one
# variable. AGENTS.md invariant 6 makes 1.97 a *two-way* constraint — the sources need
# ≥1.88 for let-chains, and clippy 0.1.97's `collapsible_if` *requires* the let-chain
# collapse that older clippy rejects — so a job floating on `stable` proves nothing
# about the MSRV and can fail on a lint the pinned toolchain does not even have.
# Bump MSRV here in lockstep with the workspace Cargo.toml `rust-version`.
# `fuzz-nightly` is the one deliberate exception: cargo-fuzz requires nightly.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: '1.97'
  # Tool versions are pinned, not floated: `--locked` pins a tool's dependency graph,
  # never the tool itself, so an unpinned `cargo install` silently upgrades across
  # majors — and cargo-deny has broken `deny.toml` schema compatibility across majors
  # before, which would fail this repo's gate for a reason that is not this repo's.
  # Safe to pin here because CI runs `cargo deny check licenses bans sources` and NOT
  # `advisories`, so a pinned binary does not freeze any advisory data.
  CARGO_DENY_VERSION: '0.19.9'
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  # Unprivileged lane: builds, lints, and the WHOLE test suite — unit + property
  # tests AND the serial-nexus-itest integration harness (design §5), which boots
  # serial-nexus-daemon/serial-nexus-sim/serial-nexus-web as subprocesses and drives them over the
  # control socket. The harness's bin() lookups resolve `target/debug/<name>`, which
  # ONLY `cargo build` produces — `cargo test` builds the test-instrumented bins under
  # `deps/`, not the plain artifact — so an explicit `cargo build --workspace` MUST
  # precede the test step (matching AGENTS.md §3's documented local flow). The
  # exec/envelope codec tests shell out to python3, which the runner image provides.
  # Runs on every push (§3). MSRV is pinned to the development toolchain (the code uses
  # let-chains freely); bump the `MSRV` env above in lockstep with Cargo.toml.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal --component rustfmt,clippy
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # **`itest/tests/expectation_gates.rs` needs `jq` and this job never installed it.**
      # Seventeen synthetic-antecedent guards — the machinery §13's gate design and plan §3
      # rule 22 both rest on, the ones that prove an expectation clause *can* redden — call
      # `have_jq()` and return green when it is absent. `platform_expectation()` picks the
      # file by `cfg!(target_os)`, so `expectations/linux.jq`'s entire clause-level guard set
      # runs ONLY on a Linux box running the suite, and this is the only such job. It has been
      # passing because the ubuntu image happens to ship jq; nothing in-tree asserted it, and
      # a runner image that dropped jq would have turned seven guards green having asserted
      # nothing — rule 22's own shape, in the file that exists to prevent it.
      - name: Install jq (expectation_gates.rs's clause guards self-skip without it)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The minimal daemon build §8 supports (every built-in codec dropped) must
      # also be warning-clean — the registry-as-value path is easy to leave with an
      # unused binding when no codec is registered.
      #
      # **`--all-targets` is plan §18 item 102's, and the workspace clippy one line
      # above has carried it all along.** Without it clippy compiles the lib and the
      # bin and no test target at all, so this lane — and both triples of the Apple
      # cross-check below, which copy its spelling — never so much as *compiled* the
      # minimal build's tests. That is how five tests in `daemon/src/registry.rs`
      # came to hard-code the presence of the `reference` codec with no feature gate,
      # while a sixth in the same module carried one.
      #
      # **The flag's own fail-first proof (§9), because the negative alone proves it
      # was needed and not that it discriminates.** Planted a type error reachable
      # only from the *minimal* test target — `let _plant: u32 = "…";` inside
      # `registry.rs`'s `#[cfg(not(feature = "codec-reference"))]` test — and ran this
      # step's command both ways against it. Without `--all-targets`: exit **0**, with
      # `Checking serial-nexus-daemon` in the log, so it did recompile and simply had
      # nothing to look at. With `--all-targets`: exit **101**, `error[E0308]` at
      # `daemon/src/registry.rs:447` and `could not compile serial-nexus-daemon (lib
      # test)`. The flag is what turns this lane from silent to loud on that class.
      #
      # **What it does NOT buy, because that is why the test step at the end of this
      # job exists.** `--all-targets` never runs a test. Measured on the unfixed tree
      # at 800915b: this exact command, `--all-targets` included, exits **0** while
      # `cargo test -p serial-nexus-daemon --no-default-features --locked` reports
      # `209 passed; 5 failed`. A failing assertion is a run-time fact.
      #
      # **But the two instruments are complementary, not ordered — an earlier draft
      # of this comment called this one "strictly weaker" and that is measured
      # false.** Four plants in the same minimal-only test fn, one stationary tree,
      # `--no-default-features` throughout; this command, then `cargo test -p
      # serial-nexus-daemon --no-default-features --locked`:
      #
      #   unused `use std::collections::HashMap;` | clippy 101 | test **0**, 214 passed
      #   `codec_names().len() == 0`              | clippy 101 | test **0**, 214 passed
      #   `!registry.contains(…)` un-negated      | clippy **0** | test 101, 1 failed
      #   `let _plant: u32 = "…";`                | clippy 101 | test 101
      #
      # Three axes, and neither instrument reaches all three. *Compile* is shared, and
      # on it `cargo test` subsumes clippy (row 4). *Lint* is clippy's alone — the
      # workspace lint table is `clippy::all = "warn"` with only `unused_must_use`
      # denied, so `cargo test` compiles both lint plants green, row 2 without
      # emitting anything at all because rustc has no `len_zero` lint. *Run* is
      # `cargo test`'s alone (row 3, which is item 102's own defect class re-planted).
      # Keep both steps: dropping either loses an axis, not a margin.
      #
      # Where `--all-targets` is load-bearing rather than merely cheap: on this lane
      # its compile half duplicates the test step and only its lint half is unique,
      # but on the Apple cross-check's two triples nothing can be *run*, so there both
      # halves are unique and that invocation is CI's only reader of this code.
      - name: Clippy (minimal daemon, no built-in codecs)
        run: cargo clippy -p serial-nexus-daemon-bin -p serial-nexus-daemon --no-default-features --all-targets --locked -- -D warnings
      # **A `#[cfg(target_os = "linux")]` mistake in test code is invisible to every
      # step above it and to the macOS lane's own first step.** `cargo build` compiles
      # no test target, so an ungated test helper referring to a gated type builds
      # clean everywhere and reddens only `cargo test`/`cargo clippy --all-targets`,
      # and only off Linux — which puts the failure in the one lane that runs last and
      # blames it on the platform (notes §3.71).
      #
      # This is the **second** recorded macOS-only compile break and the first of its
      # shape. §3.65 A was the first: `serial-nexus-devprep` was an unconditional
      # workspace member using a Linux-only symbol. That one at least reddened
      # `cargo build --workspace`, the macOS lane's own first step. This one does not
      # — `cargo build` compiles no test target — which is why a *new* instrument was
      # needed rather than a second reading of the old one.
      # A compile-only cross-check is the cheapest instrument that sees the class:
      # `check` does not link, needs no Apple SDK, and costs one rustup std download.
      #
      # **BOTH Apple triples, and that is measured rather than belt-and-braces.**
      # Neither target is a superset of the other, proved by planting a defect in each
      # direction inside a `#[cfg(target_os = "macos")]` module and running both
      # (notes §3.71):
      #
      #   plant                          x86_64 check   aarch64 check
      #   x86-only intrinsic             PASSES         caught (E0433)
      #   aarch64-only NEON type         caught (E0433) PASSES
      #
      # So each triple catches exactly the arch-specific code written on the *other*
      # architecture — the same mistake as this session's, one axis over: reaching for
      # `target_os` when the code is really `target_arch`. That is a live risk here and
      # not a hypothetical: `macos-latest` is arm64, the bench rig is an Intel Mac, and
      # `sys/src/usb_macos.rs` is hand-written FFI in the one crate allowed `unsafe`.
      # There are zero `target_arch` hits in the tree today; this keeps it that way
      # cheaply instead of discovering the first one from a support report.
      #
      # **Say what this does NOT cover (§9).** `serial-nexus-web` is excluded because
      # its TLS stack pulls `ring`, whose build script needs a real Apple C toolchain
      # — `cc` on a Linux runner rejects `-arch arm64` outright, so the step would be
      # red for a reason that is not a defect. That is the same exclusion AGENTS.md §3
      # already names for the by-hand macOS cross-check, and it means a stolen cfg
      # inside `web`'s own test code still reaches only the macOS lane. Every other
      # crate — including `daemon`, where both recorded instances landed — is covered.
      #
      # **It runs `clippy`, not `check`, and that is plan §18 item 54.** Clippy does
      # everything `cargo check` does and then lints, so this is strictly the wider
      # instrument at nearly the same cost — and the class it adds is a real hole, not a
      # tidiness one. Lints were running on Linux only: `clippy` (workspace and
      # minimal-daemon) lived in this job and nowhere else, and the `macos` job runs no
      # lint at all, so **cfg-gated-only-caller dead code was caught by nothing in CI**.
      # A helper whose only caller is `#[cfg(target_os = "linux")]` is dead off Linux,
      # and dead code is a `-D warnings` error.
      #
      # Measured on the development box before the change, planting exactly that shape in
      # `sys/src/lib.rs` — an ungated private fn with one Linux-only caller (item 54's
      # validation clause, read at its error text per plan §3 rule 17 f):
      #
      #   lane                                              exit   says
      #   `cargo clippy --workspace` (Linux, this job)         0    nothing — blind
      #   `cargo check --target aarch64-apple-darwin`          0    nothing — blind
      #   `cargo clippy --target aarch64-apple-darwin`       101    error: function
      #                                                             `item54_planted_helper`
      #                                                             is never used
      #
      # So neither pre-existing lane saw it and this one does. All four invocations below
      # are green on the unplanted tree, measured the same session.
      #
      # The minimal-daemon build gets the same treatment on both triples for the reason
      # the Linux lane already gives it: the registry-as-value path is easy to leave with
      # an unused binding when no codec is registered, and "unused" is exactly the class
      # that changes meaning with the target. It carries `--all-targets` for the reason
      # the Linux minimal lane now states at length (plan §18 item 102): without it the
      # invocation compiles no test target, so a `#[cfg]` mistake in the minimal build's
      # *test* code — the very class this whole step exists to catch, one feature axis
      # over — was invisible on both triples. **Do not read that as "the weaker
      # instrument", which is what an earlier draft of this said.** Cross-compiled
      # clippy cannot run a test, so it misses the run-time axis; but it is the only
      # step in CI that lints these targets at all, and lints are an axis `cargo test`
      # misses in turn (the four-plant measurement is on the Linux minimal step above,
      # where both instruments exist and can be compared). Off Linux there is no
      # comparison to make: this is the only reader, so it carries the flag.
      - name: Cross-check macOS targets compile AND lint (stolen cfg + macOS-only dead code)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo clippy --target "$t" --workspace --exclude serial-nexus-web \
              --all-targets --locked -- -D warnings
            cargo clippy --target "$t" -p serial-nexus-daemon-bin -p serial-nexus-daemon \
              --no-default-features --all-targets --locked -- -D warnings
          done
      # `cargo test` does NOT emit `target/debug/serial-nexus-daemon` (only the deps/ test
      # bins); the serial-nexus-itest harness boots that plain artifact, so build it first.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      # `SNX_EXEC_CODEC=required` is the seventh instance of the one required-mode
      # mechanism (plan §3 rule 11, plan §18 item 49), and this is the job that earns
      # the right to set it: the ubuntu image provides python3, so a skip *here* is a
      # runner that lost the interpreter, not a laptop without it. A battery spread over
      # six files drives a codec child through it — the whole out-of-process extension
      # surface §8 and §15.26 promise — and until item 49 no lane asserted they had
      # executed, so an image that dropped python3 would have reported the entire
      # battery green without running a byte of it. Rule 22's tell in its plainest form:
      # the passing output and the not-running output are the same line, and libtest
      # captures a passing test's stderr, so even the SKIP lines are invisible without
      # `--nocapture` (notes §3.78).
      #
      # `SNX_TLS=required` for the same reason, and it had the same gap: `web_tls_round_trip`
      # is the only proof the TLS tier's handshake *works* rather than merely that it binds,
      # and it carries two silent skip causes (no `curl`; a sandbox that cannot bind
      # `0.0.0.0:0` with `--tls`). The mechanism has existed since plan §18 item 10 and **no
      # CI lane ever set it**. This runner has curl and can bind, so a skip here is a lane
      # that lost a prerequisite, not a laptop without one.
      #
      # `--no-fail-fast` for the reason the macOS lane already gives at length: `cargo test
      # --workspace` stops at the first failing test BINARY, so a red run reports one crate
      # and says nothing about the ~110 targets behind it. That lesson was written down after
      # it cost six consecutive macOS pushes (docs/macos.md, 2026-07-28) and reached only the
      # macOS job; a job that is going to be red anyway costs nothing by being red completely.
      - name: Test (unit + property + serial-nexus-itest integration harness)
        env:
          SNX_EXEC_CODEC: required
          SNX_TLS: required
        run: cargo test --workspace --locked --no-fail-fast
      # **The minimal daemon build's tests, RUN — plan §18 item 102.** AGENTS.md §3 lists
      # "the minimal-daemon clippy" among the gates, design §8 promises every built-in
      # codec is droppable ("minimal builds drop what they don't need"), and
      # `docs/codec-authors.md` hands that configuration to in-tree codec authors as the
      # one their codec must keep working in. **No lane had ever run it.** It was red —
      # five tests in `daemon/src/registry.rs` asserting a default-features property
      # with no feature gate — for as long as nobody looked. `--all-targets` on the
      # clippy steps above does not close this: it proves the tests compile, and these
      # compiled.
      #
      # **Both ends, on a tree that did not move (§9).** The first version of this table
      # was taken in a working tree that carried unrelated in-flight edits under
      # `daemon/src/`, and its `ignored` column did not reproduce. Re-taken against a
      # `git archive HEAD` copy of `800915b` in a scratch directory, where the only file
      # that ever differs from HEAD is `daemon/src/registry.rs`, swapped by `cp` and
      # md5-verified each way (HEAD `ead10b74…`, item 102's `3c8bdc9f…`). Linux
      # 7.0.0-30, 20 cores, `cargo -j 6`, load average 11.3–20.7 across the runs — the
      # box was busy and the checkout next door was being edited, which is precisely
      # why the measurement was moved out of it. Do not re-derive these four cells from
      # a working tree: the same day, the checkout read 215 and 222 against the table's
      # 214 and 221, the whole difference being one test added under `daemon/src/` by
      # work that has nothing to do with item 102.
      #
      #                          |      lib test binary       | doctests
      #   HEAD, default          | 217 passed 0 failed 0 ign. | 1 passed
      #   HEAD, minimal          | 209 passed **5 failed** 0 ign. | did not run
      #   + item 102, default    | 221 passed 0 failed 0 ign. | 1 passed
      #   + item 102, minimal    | 214 passed 0 failed 0 ign. | 1 passed
      #
      # **`0 ignored` in all four cells**; the `1`/`2` an earlier table carried in that
      # column was the doctest line misread. The unfixed minimal row runs no doctest at
      # all because a red lib binary ends the run before cargo reaches them — which is
      # itself worth knowing: the configuration was not merely failing five assertions,
      # it was not completing.
      #
      # Decomposed by test *name* (`-- --list`), not by count. Default 217 → 221 is
      # **+4**, every one of them in `registry::tests` (7 names → 11); no other module
      # moved. Minimal 214 → 214 is **+0** with exactly one name exchanged —
      # `with_builtins_registers_the_reference_codec` out (it asserted the wrong build's
      # contract) and `with_builtins_registers_nothing_when_every_built_in_codec_feature_is_off`
      # in — and 5 red become 0 red. At the fixed end the two configurations share 213
      # names; default adds 8 (6 registry `#[cfg(feature)]` ones plus two pre-existing
      # `nodes::codec` ones) and minimal adds 1. 213+8 = 221, 213+1 = 214: closes with
      # nothing left over.
      #
      # **Placed last, and conditional, because both directions of the hiding are real.**
      # A failed step skips every unconditional step behind it, so a step here without
      # `if:` would be hidden by a red workspace suite — notes §3.77's exact harm, the one
      # that kept the macOS doctor gate from executing at all for two days. `!cancelled()`
      # means nothing ahead can hide this lane: it reports on any run that was not
      # cancelled, including one where the format check, clippy, the build or the whole
      # suite is red, because "does the minimal configuration pass its own tests" is an
      # independent claim about an independently compiled tree. And it is **last**, so it
      # can hide nothing in return — the mirror harm the macOS job names where it reorders
      # its own gate. A five-test failure must not cost the reader the whole-workspace
      # result standing above it.
      #
      # No `cargo build --workspace` is needed ahead of it: this is `serial-nexus-daemon`'s
      # own unit and property tests, not the serial-nexus-itest harness, so it boots no
      # subprocess and resolves no `target/debug/` artifact.
      #
      # **The package set is spelled to match the minimal clippy step exactly**, and it
      # was not at first: clippy took `-p serial-nexus-daemon-bin -p serial-nexus-daemon`
      # while this step took only the library, so the comment above argued from a
      # coverage claim the command did not meet. Aligning is the cheaper repair than
      # explaining the gap. `serial-nexus-daemon-bin` carries 0 `#[test]` today, so the
      # step gains one `Running unittests src/main.rs … running 0 tests` line and one
      # compile of that thin binary in test cfg; measured warm at 1.41 s and 1.95 s
      # against 1.24 s for the library alone, cold at 34.11 s against a 2.79 s warm
      # library run. What it buys is that the two minimal lanes can never drift into
      # disagreeing about which crates the minimal build *is*, and a future `#[cfg(test)]`
      # block in the binary is covered the day it lands rather than the day someone
      # notices. Note the feature edge that makes this honest: the workspace pins
      # `serial-nexus-daemon = { path = "daemon", default-features = false }`, so
      # `--no-default-features` on the binary really does yield a minimal library
      # instead of unification quietly switching `codec-reference` back on.
      #
      # `--no-fail-fast` follows from that alignment and did not before it: two packages
      # are two test binaries, and §6's rule is that a first-binary stop makes "one known
      # failure" and "several unknown ones" look identical. It costs nothing here.
      - name: Test (minimal daemon, no built-in codecs — item 102)
        if: ${{ !cancelled() }}
        run: cargo test -p serial-nexus-daemon-bin -p serial-nexus-daemon --no-default-features --no-fail-fast --locked

  # The licensing gate proven, not assumed (§13). cargo-deny plus the serial-nexus-itest test
  # that proves the gate rejects a banned crate (§16.11 folded the bash script into it;
  # it self-skips where cargo-deny is absent, so this job — which installs it — is where
  # it runs for real). The job compiles repo code (that serial-nexus-itest test), so it pins the
  # MSRV like every other compiling job, and it caches: without `rust-cache` it rebuilt
  # cargo-deny from source on every single push.
  license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: License and ban check
        run: cargo deny check licenses bans sources
      # `SNX_LICENSE_GATE=required` turns the gate's self-skip into a failure, the same
      # shape `SNX_WEB_UI=required` gives the browser gate. This is the job that
      # provisions both prerequisites the gate needs — cargo-deny above, and a network
      # that can resolve the planted crate — so a skip *here* is a gate CI passes over a
      # hole (plan §3 rule 7), not a laptop without the tool.
      - name: Prove the gate rejects a banned crate
        env:
          SNX_LICENSE_GATE: required
        run: cargo test -p serial-nexus-itest --test p0_license_gate --locked

  # Capability report (design §15.17): run every probe on the runner, assert the
  # platform expectation, and archive the Markdown so every capability claim has a
  # dated report behind it. `skipped(no adapter)` is a valid CI verdict. (The
  # no-unsupported assertion is ALSO covered by serial-nexus-itest tests/meta_gates.rs; this
  # job additionally archives the human report.)
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Capability report
        run: |
          # ONE run, both consumers (plan §18 item 43). `--json-out` writes the JSON twin
          # of the same `Report` the Markdown renders, so the gate reads the report that
          # was archived rather than a second measurement of the same box — P9's and P10's
          # numbers move run to run, which is why the era diffs take three samples
          # (notes §3.74).
          #
          # **Not `| tee`.** The doctor exits **1** when any probe reports `unsupported`
          # (`report.any_unsupported()`) and **2** when it could not produce a report at
          # all — and in a pipeline the step's status is the LAST command's, so `tee`
          # returning 0 discarded both. That is the `jq -e` defect in a second costume
          # (AGENTS §3): a command that reads as a gate and cannot fail the lane on its
          # own account. Redirect, so the exit status is the command's (notes §3.77).
          #
          # This job has no separate build step — `cargo run` is the build — so it stays
          # `cargo run`; the macOS lane runs the artifact its own build step produced.
          cargo run -q --locked -p serial-nexus-doctor -- --markdown \
              --json-out serial-nexus-doctor-report.json > serial-nexus-doctor-report.md
          jq -e -f expectations/linux.jq serial-nexus-doctor-report.json
      # **Both renderings, because only one of them is the artifact of record.** The
      # Markdown is for reading; the JSON is the only form the gate and the field-set
      # recompute can read, and the only one that records whether a value is a number,
      # a string or a boolean (notes §3.74). Uploading only the Markdown wrote the twin
      # and then threw it away at the end of every run — which is the half plan §18
      # items 8 and 18 are owed captures of. `!cancelled()` for the reason the macOS lane
      # gives: a report that failed its expectation is the one most worth reading, and
      # without the condition a red `jq -e` uploaded nothing at all.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: serial-nexus-doctor-report
          path: |
            serial-nexus-doctor-report.md
            serial-nexus-doctor-report.json

  # The packaging gate (plan §18 item 31). Two arms, and the split is the point.
  #
  # The UNPRIVILEGED arm demands the validators — `systemd-analyze verify` over the
  # unit, `udevadm verify` over the udev rules, each staged past its environmental
  # arm. Without `required`, a runner image that stopped shipping systemd would
  # report the whole packaged deployment surface green without reading a byte of it,
  # and libtest captures a passing test's stderr so even the SKIP line would be
  # invisible (plan §3 rules 11 and 22). Three text checks in the same file need no
  # tool at all and never skip, so the drift class this tree can actually cause —
  # the unit and its README disagreeing — stays covered even where systemd is absent.
  #
  # **The tool needs using carefully and that was measured, not assumed.** With the
  # unit's `ExecStart` pointing at an uninstalled binary, `systemd-analyze verify`
  # exits 1 for that reason alone, which masquerades as "it caught my defect"; with
  # the path staged to an executable stub, systemd 259 exits **0** on an unknown
  # directive, an unknown section AND a bad value. What is always present is the
  # diagnostic on stderr, so the gate asserts exit 0 **and empty stderr**. A command
  # that prints a complaint and exits 0 is the `jq -e` defect in a third costume.
  #
  # The ROOT arm is item 31's owed measurement: what `DynamicUser=` does to
  # `StateDirectory=`, and what `ReadWritePaths=` does NOT do to ownership. A
  # development box cannot run it — it cannot `systemctl start` (polkit refuses
  # without a terminal to prompt on), and the user-namespace fallback is closed by
  # AppArmor rather than by the kernel: `unshare -U` succeeds, but the new namespace
  # is transitioned into the `unprivileged_userns` profile with an empty `CapEff`, so
  # the `/proc/self/uid_map` write `unshare -Ur` then performs returns `EPERM` (the
  # measured cause; `p8_packaging.rs::skip_no_packaging_root` carries the reading and
  # the refutation of the earlier `uid_map`-policy diagnosis).
  #
  # **This runner can, and that was measured before it was demanded** — the discipline
  # `SNX_RIG_FLOW` set (§15.52). The "What this runner actually is" step below reads
  # `PID 1: systemd` and `sudo: passwordless` on `ubuntu-latest`, and the root arm has
  # run the measurement green (6 passed / 0 failed; run 31695823765, 2026-08-13,
  # reproduced at 31877969760, 2026-08-15). So `SNX_PACKAGING_ROOT=required` is set on
  # that step as of 2026-08-15: a runner image that stops providing systemd-as-PID-1
  # or passwordless root now reddens the lane instead of self-skipping past it.
  # Before that it was set by NO lane, which meant the root step's passing output was
  # identical to its self-skipping output — AGENTS §3's tell, in the one step that had
  # just been un-escaped from `continue-on-error` in order to gate.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq (locating the test binary from cargo's JSON output)
        run: sudo apt-get update && sudo apt-get install -y jq
      # The precondition, measured and printed rather than assumed. This step is what
      # established that SNX_PACKAGING_ROOT could be demanded, and it stays because it
      # is the reading a future runner-image change would move first.
      - name: What this runner actually is
        run: |
          echo "PID 1:  $(cat /proc/1/comm 2>/dev/null || echo '<no procfs>')"
          echo "uid:    $(id -u)   sudo: $(sudo -n true 2>/dev/null && echo passwordless || echo 'needs a password')"
          systemd-analyze --version 2>/dev/null | head -1 || echo 'no systemd-analyze'
          udevadm --version 2>/dev/null || echo 'no udevadm'
          command -v systemd-run || echo 'no systemd-run'
      - name: Packaging gate (unprivileged; the validators are required here)
        env:
          SNX_PACKAGING: required
        run: cargo test -p serial-nexus-itest --test p8_packaging --locked -- --nocapture
      # The root arm now *starts the daemon* under the packaged sandbox (item 31's
      # four remaining `unverified` rows), so it needs the plain artifacts and not
      # only the instrumented test binary — `cargo test` never builds
      # `target/debug/serial-nexus-daemon`, which is the same fact `serial_nexus_itest::bin`
      # documents for every other harness. Two packages rather than `--workspace`: the
      # daemon the unit's `ExecStart=` names, and the CLI the probe drives it with from
      # inside the same sandbox — not the web tier's toolchain. (`serial-nexus-daemon-bin`
      # is the package; `serial-nexus-daemon` is the binary it emits, which is the name
      # `RootStage::stage_binaries` looks for beside the test executable.)
      # A probe that cannot find them SKIPS naming the miss, and `SNX_PACKAGING_ROOT=required`
      # then turns that skip into a red lane — so a build step that silently stopped
      # producing them cannot pass as a green measurement.
      #
      # **Both of the next two steps carry a condition, and it is the macOS lane's
      # repair applied here** (plan §18 item 48's placement half, notes §3.77): a
      # failed step skips the rest of the job, so before this the unprivileged gate
      # going red would have hidden the root arm entirely — and a hidden gate's output
      # is indistinguishable from a passing one, which is the tell AGENTS §3 names.
      # The root arm keys on the *build*, not on the gate above it, so the two signals
      # are independent and neither can mask the other.
      - name: Build the daemon and CLI (the root arm starts them inside the sandbox)
        id: rootbins
        if: ${{ !cancelled() }}
        run: cargo build -p serial-nexus-daemon-bin -p serial-nexus-ctl --locked
      # `cargo test` is deliberately NOT re-run under sudo: root has a different HOME
      # and PATH, cargo would re-resolve and rebuild, and a sudo'd build is a different
      # build. The already-built binary is run instead, and its path comes from cargo
      # itself rather than from a glob — rule 7's "enumerate from the tool", applied to
      # a file path.
      # **Gating again as of 2026-08-13, and the round trip is the point.** This step is
      # named "reporting only" and for one day it was: it had reddened `packaging` on
      # every push since the arm landed, always for the probe's own reasons and never
      # for the packaged unit's, so it was made `continue-on-error` while five
      # successive defects were found and fixed — `/tmp` under `PrivateTmp=`, a `/run`
      # collision with the unit's own `RuntimeDirectory=`, `:` as a POSIX special
      # built-in exiting dash on a redirection error, a `2>` applied after the
      # redirection that failed, and a control directory on a tree
      # `ProtectSystem=strict` does not actually refuse. Plan §18 item 31 sequenced it
      # exactly this way ("its `required` mode is switched on only after a CI run
      # proves the runner actually provides systemd as PID 1"), and item 68 carried the
      # flip as a debt precisely because **a step that asserts nothing is what AGENTS §3
      # calls a tell** and must not be left in place. The arm is green — the probe runs
      # under `DynamicUser=yes`, prints all nine readings, and both halves of Claim 4
      # hold — so the escape hatch is gone and a regression here fails the lane again.
      #
      # **`SNX_PACKAGING_ROOT=required` as of 2026-08-15, and it is passed through
      # `env` rather than through this step's `env:` block for a load-bearing reason.**
      # `sudo` runs with `env_reset` by default, so a workflow-level `env:` never
      # reaches a process launched as `sudo "$BIN"` — the variable would be unset in
      # the test, the root-gated test would find root and run anyway, the step would
      # stay green, and `required` would assert exactly nothing. That is AGENTS §3's
      # tell reintroduced by the very edit meant to remove it. `sudo -n env VAR=value`
      # sets it in the child regardless of sudoers policy, which is why the variable
      # is spelled at the call and not in an `env:` block.
      #
      # **What the probe line below does and does not prove, stated exactly, because
      # the honest scope is narrower than it looks:** `env VAR=x` always sets `VAR`
      # for its child, so that line cannot detect the variable "failing to arrive" —
      # it detects `sudo -n` not working at all (no passwordless sudo, no tty, a
      # sudoers policy that refuses), which would otherwise surface as a confusing
      # failure inside the test binary rather than as a named precondition. It is a
      # sudo probe, not an environment probe. Claiming more of it here would be the
      # assertion-weaker-than-its-comment register of AGENTS §3's tell, which is the
      # defect this whole step exists to have stopped committing.
      #
      # **What the arm covers as of 2026-08-21 (plan §18 item 31's four remaining
      # `unverified` rows).** It no longer only measures what `DynamicUser=` does to a
      # directory: it *executes the two recipes this repository prints for operators*,
      # each from the file that prints it. The socket-group recipe is a comment block
      # in `packaging/serial-nexus-daemon.service` — its `groupadd`/`useradd` lines are
      # run verbatim but for the `sudo` this step already has, its static-identity
      # directives are applied to the packaged properties, and its two predicted `stat`
      # lines are checked. The upgrade procedure is `packaging/README.md`'s "Upgrading
      # to this build", and its root `cp` is run step by step. Between them the real
      # daemon is started inside the packaged sandbox and asked for `state` over its own
      # control socket.
      #
      # **`--test-threads=1` below is for the output, not for the identity**, and the
      # distinction matters because the identity is the part that would actually break.
      # Two probes create the same system user and group; what serialises them is
      # `p8_packaging.rs`'s `RECIPE_IDENTITY` mutex, whose guard is held for the
      # lifetime of the `RecipeIdentity` that deletes them in `Drop`, so the binary is
      # safe under parallelism with or without this flag. What the flag buys is that
      # `--nocapture`'s stream stays readable: parallel test binaries interleave writes
      # and split lines mid-write, which is notes §3.78's SKIP-line class and is how a
      # skip reason stops being greppable.
      #
      # **A probe that cannot run says which precondition failed and skips**, and
      # `SNX_PACKAGING_ROOT=required` turns every one of those skips into a red lane
      # here — including "the daemon binary is not built", which is why the build step
      # above cannot silently stop producing it. (`skip_no_packaging_root` asserts on
      # the variable before it prints the SKIP line, so required mode is a panic and
      # not a louder log.)
      #
      # **Cite this step by NAME and never by line number.** At `800915b` this step's
      # `- name:` line was 399 and the `external-codec:` job was 419, which is exactly
      # what `docs/vmcell-requirements.md` cited and exactly right at the time; two new
      # steps and several comment blocks in one session moved both, and no number is
      # written here because this comment would move it again. A third citation,
      # `docs/implementation-notes.md`'s `ci.yml:195`/`:251` for the `jq -e` gates, was
      # *already* wrong at `800915b` — the two `jq -e -f expectations/` lines stood at
      # 279 and 481 there. A line number into a file that grows is a claim with a shelf
      # life measured in commits; a step name is one the file itself carries.
      - name: Packaging gate (root arm — item 31's owed measurement)
        if: ${{ !cancelled() && steps.rootbins.outcome == 'success' }}
        run: |
          BIN=$(cargo test -p serial-nexus-itest --test p8_packaging --locked --no-run \
                  --message-format=json \
                | jq -r 'select(.executable != null and .target.name == "p8_packaging") | .executable' \
                | tail -1)
          test -n "$BIN" || { echo "could not locate the p8_packaging test binary"; exit 1; }
          sudo -n env SNX_PACKAGING_ROOT=required \
            sh -c 'test "$SNX_PACKAGING_ROOT" = required' \
            || { echo "SNX_PACKAGING_ROOT did not survive sudo — the run below would assert nothing"; exit 1; }
          echo "running $BIN as root with SNX_PACKAGING_ROOT=required"
          sudo -n env SNX_PACKAGING_ROOT=required "$BIN" --nocapture --test-threads=1

  # Out-of-tree codec template (§15.26 / plan §10.3): build the out-of-tree stand-in
  # from the CONSUMER's own position (its own workspace manifest, path deps standing
  # in for version pins), run its conformance-kit test, and prove the custom daemon
  # serves its `acme` codec alongside the built-ins. §16.11 folded the bash script into
  # serial-nexus-itest tests/p8_external_codec.rs, which now builds the excluded template itself
  # (the `check` job's `cargo test --workspace` also exercises it; this job keeps an
  # isolated signal for the embedding pattern — a consumer building against the MSRV).
  external-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Build and exercise the out-of-tree template
        run: cargo test -p serial-nexus-itest --test p8_external_codec --locked

  # macOS is best-effort (design §13). Now that the PTY node works on macOS (§7.2
  # slave-termios) and the harness is portable Rust, the macOS lane runs the SAME
  # `cargo test --workspace` as Linux: the serial-*device* tests self-skip (a pty is
  # not a serial device on macOS — serial2 → ENOTTY), while control-plane, pty,
  # codec, exec, leg, tap, and web tests all run. The doctor macos.jq gate is now a
  # REAL gate (P2 is `degraded`, not `unsupported`). Deltas documented in docs/macos.md.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - name: Install jq
        run: brew install jq
      # As on Linux: `cargo test` never emits the plain `target/debug/serial-nexus-daemon`
      # the serial-nexus-itest harness boots — build the workspace bins first.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        id: build
        run: cargo build --workspace --locked
      # **The gate runs BEFORE the tests, and that ordering is plan §18 item 48's second
      # half.** It used to sit last, and every macOS run from at least 2026-08-10 to
      # 2026-08-12 failed at the test step — a failed step skips the rest of the job, so
      # the one gate AGENTS §3 says this lane gates on was not running at all. That is
      # plan §3 rule 22's own class arriving by *placement* rather than by spelling: the
      # step's passing output and its not-running output were both "nothing", and the
      # first time it did execute it could not even exec the binary (notes §3.77, §3.83).
      #
      # The gate needs only `cargo build`, never `cargo test`, so the fix is to put it
      # where its real dependency is. The test step below then carries an explicit
      # condition so the swap does not simply move the hiding in the other direction: it
      # runs whenever the *build* succeeded, whatever the gate did. Both signals now
      # reach the lane on every run that compiled, which is the property that was missing.
      - name: Capability report + macos.jq gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # The diagnostic prints on green runs too, deliberately: 2026-08-12's ENOEXEC
          # (`cannot execute binary file`, on a runner where `cargo build --workspace`
          # had just succeeded) has not recurred and **no cause is claimed for it** — it
          # was seen once and has not been seen since, which is not the same as explained
          # (AGENTS §8). Evidence on every run is what makes the next occurrence
          # diagnosable instead of guessable.
          uname -m; sw_vers || true
          ls -la target/debug/serial-nexus-doctor || true
          file target/debug/serial-nexus-doctor || true
          # One run, both consumers — the Linux lane's reasoning, verbatim (plan §18 item 43).
          # `cargo build` above already produced it, so run the artifact directly: the
          # extra `cargo run` resolve is what the pipeline's exit status was hiding.
          ./target/debug/serial-nexus-doctor --markdown \
              --json-out serial-nexus-doctor-macos.json > serial-nexus-doctor-macos.md
          jq -e -f expectations/macos.jq serial-nexus-doctor-macos.json
      # `--no-fail-fast` here and not on the Linux lane, because this is the lane nobody
      # runs before pushing. `cargo test --workspace` stops at the first failing test
      # BINARY, so a red macOS job reports one crate and says nothing about the 80-odd
      # targets behind it — which is exactly how one failing unit test hid three more for
      # six consecutive pushes (docs/macos.md, the 2026-07-28 block). The lesson was
      # written down then and never reached this file; a job that is going to be red
      # anyway costs nothing by being red *completely*.
      #
      # The condition is the other half of the reorder above: a red *gate* must not hide
      # the suite any more than a red suite was allowed to hide the gate. It keys on the
      # build because that is what this step actually needs.
      # `SNX_EXEC_CODEC=required` here as well as on the Linux lane: the macOS image also
      # provides python3, so the out-of-process codec battery must prove it executed
      # on both platforms rather than only on one. Item 49 built the mechanism and wired the
      # Linux lane; leaving macOS unset would make the extension surface silently skippable on
      # exactly the platform this lane exists to cover.
      - name: Build + test (portable core + integration harness; serial tests self-skip)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SNX_EXEC_CODEC: required
        run: cargo test --workspace --locked --no-fail-fast
      # Both renderings — the Linux lane's reasoning, verbatim (notes §3.74). `!cancelled()`
      # because a report that FAILED its expectation is the one most worth having in hand;
      # without it a red gate uploaded nothing and left the reader with only the log.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: serial-nexus-doctor-macos-report
          path: |
            serial-nexus-doctor-macos.md
            serial-nexus-doctor-macos.json

  # The web console's browser half, in real headless Chromium (design §15.37, plan §15).
  # §16.7's doctrine only allows a behavior the sim cannot exercise to be checklist-
  # verified or marked unverified — and a checklist does not run per push, which is what
  # left the OPFS splice, the epoch re-anchor and the editor flows unasserted where they
  # actually run. This job provisions node plus the pinned Chromium and runs the two
  # gates that need a JS runtime: `p8_web_ui`, which boots the daemon + sim fixture and
  # hands a pinned Playwright suite a bootstrap URL, and `p8_web_history`, which runs the
  # pure browser modules under `node --test`.
  #
  # `SNX_WEB_UI=required` is the point of the job: both gates self-skip when node or the
  # browser is missing (so a developer's `cargo test --workspace` is unaffected, and the
  # `check` job above skips them), and this variable turns every one of those skips into a
  # failure. Without it the job could go green having run nothing — the same shape as the
  # fuzz loop that ran a stale list (§15.36 rule 7). `p8_web_ui` additionally asserts a
  # floor on the number of specs that passed — a different floor per fixture, one for the
  # with-device arm and one for the device-free arm — and that nothing skipped itself when
  # a device was present. The two numbers are deliberately NOT repeated here: they live as
  # `SPECS_WITH_DEVICE` / `SPECS_DEVICE_FREE` in `itest/tests/p8_web_ui.rs`, next to the
  # spec recount that justifies them, because this comment carried "19 with a serial
  # device, 10 device-free" against constants that had since become 22 and 12 — a lane
  # description drifting from the gate it describes is exactly what naming the constants
  # instead of copying their values prevents.
  #
  # `@slow` specs (today two, both in `console.spec.mjs`: the forced tap shed, and the
  # unwatched-console tap release whose subject is the grace interval itself) are excluded
  # here and run in the nightly lane below — Playwright's spelling of this repo's
  # `#[ignore]` convention.
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui-tests/package-lock.json
      # `npm ci` installs exactly the committed lockfile — the dev-time dependency tree
      # is pinned like every other tool version in this file (§15.37: "the browser and
      # package versions are pinned").
      - name: Install the pinned Playwright package
        working-directory: web/ui-tests
        run: npm ci
      # Keyed on the lockfile, because the browser build Playwright wants is a function
      # of the Playwright version. A miss costs the ~115 MiB download once.
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: web/ui-tests
        run: npx playwright install --with-deps chromium
      # The gate boots the plain `target/debug/{serial-nexus-daemon,serial-nexus-sim,serial-nexus-web}`
      # artifacts, which only `cargo build` emits (see the `check` job).
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite
        env:
          SNX_WEB_UI: required
        run: cargo test -p serial-nexus-itest --test p8_web_ui --locked
      # The browser console's *pure* modules (`history.mjs`, `saver.mjs`, `ansi.mjs`,
      # `graph.mjs`) under `node --test`. It runs in the `check` job too, but there it
      # self-skips when the image ships no node — invisibly, because libtest captures a
      # passing test's stderr (review 32 TESTR-6). This is the job that provisions node,
      # so this is the job that can make the skip a failure.
      - name: Browser console modules (node --test)
        env:
          SNX_WEB_UI: required
        run: cargo test -p serial-nexus-itest --test p8_web_history --locked
      # Traces and screenshots for a failing spec (§15.37). `if: failure()` so a green
      # run uploads nothing.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: web/ui-tests/test-results
          retention-days: 7

  # Nightly soak (§Phase 8 item 2): the reference-topology data plane under sustained
  # synthetic load, asserting bounded RSS, allowlisted counters, zero faults, and a
  # final checksum reconciliation. The `#[ignore]`d endurance test, parameterized by
  # the same SOAK_* env knobs the bash used. A true 24-hour soak runs on dedicated
  # hardware before a release; CI runs a bounded slice.
  soak-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # p8_soak boots serial-nexus-daemon + serial-nexus-sim; `cargo test -p serial-nexus-itest` would not
      # produce those plain artifacts, so build the workspace bins first.
      - name: Build workspace binaries (soak boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Soak (30 minutes)
        env:
          SOAK_SECONDS: '1800'
          SOAK_INTERVAL: '30'
        run: cargo test -p serial-nexus-itest --locked --test p8_soak -- --ignored --nocapture

  # Nightly full sweep (post-1.0 §9.5, design §16.5): the complete suite INCLUDING the
  # #[ignore]d endurance/heavy tests — "a validation suite that only runs on the
  # author's machine is a reliability claim on the honor system." Now just the Rust
  # suite with ignored tests included; the exit code is the verdict.
  sweep-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      # `cargo test` never emits the plain workspace bins the serial-nexus-itest harness boots.
      - name: Build workspace binaries (serial-nexus-itest boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Full suite including ignored (endurance/heavy)
        run: cargo test --workspace --locked -- --include-ignored

  # Nightly browser lane: the same gate with the `@slow` specs included — today two, both
  # in `console.spec.mjs`. The forced tap shed drowns the renderer on purpose and takes
  # about a minute of real browser time to surface the counter it is asserting; the
  # unwatched-console tap release waits out the shipped grace interval twice, because that
  # interval is the thing under test and shortening it would assert a timer this product
  # does not ship. Playwright's spelling of the `#[ignore]` + nightly-sweep convention the
  # Rust suite already uses.
  web-ui-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install "$MSRV" --profile minimal && rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui-tests/package-lock.json
      - name: Install the pinned Playwright package
        working-directory: web/ui-tests
        run: npm ci
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/ui-tests/package-lock.json') }}
      - name: Install the pinned Chromium
        working-directory: web/ui-tests
        run: npx playwright install --with-deps chromium
      - name: Build workspace binaries (the gate boots them as subprocesses)
        run: cargo build --workspace --locked
      - name: Browser suite, slow specs included
        env:
          SNX_WEB_UI: required
          SNX_UI_SLOW: '1'
        run: cargo test -p serial-nexus-itest --test p8_web_ui --locked
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-nightly
          path: web/ui-tests/test-results
          retention-days: 7

  # Nightly fuzzing (§Phase 8, widened by review 26 SEC-7): every parser on an
  # externally-reachable surface, on top of the existing proptest coverage. Needs a
  # nightly toolchain and libFuzzer — the one job that does NOT pin the MSRV.
  fuzz-nightly:
    # Scheduled or hand-started; see the `workflow_dispatch` note on `on:` above.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # cargo-fuzz has no `--locked` flag of its own (checked: 0.13.2 `build`/`run`),
      # so the committed fuzz/Cargo.lock is asserted here instead — a drifted lock must
      # fail loudly rather than be regenerated in silence. `fetch` also warms the deps
      # the build below needs.
      - name: Verify fuzz/Cargo.lock is current (cargo-fuzz takes no --locked)
        working-directory: fuzz
        run: cargo +nightly fetch --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      # The target list comes from cargo-fuzz itself, never a hand-maintained copy:
      # the literal list this replaced named four targets while `fuzz build` above
      # built nine, so the five parsers added to close review-26 SEC-7 (the control
      # socket's front door, the tap.data base64 codec, GraphConfig deserialize +
      # validate, RequestLines, and the web HTTP head parser) were compiled every
      # night and fuzzed never. A target added under fuzz/fuzz_targets/ is now fuzzed
      # the night it lands. The empty-list guard matters for the same reason: a
      # silently empty loop is exactly the failure mode being fixed, and it must not
      # be able to report green.
      - name: Fuzz every target briefly
        working-directory: fuzz
        run: |
          targets="$(cargo +nightly fuzz list)"
          echo "targets: $targets"
          test -n "$targets"
          for t in $targets; do
            echo "=== fuzzing $t ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
