[package]
name = "serial-nexus-devprep"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "serial_nexus device-preparation helper: re-enumerates a named USB serial adapter and grants the invoking user access to the tty nodes it produces, so a test run finds its devices ready (design §15.45, §15.55)."

# The one binary in this workspace that is meant to carry a Linux file capability
# (§15.45). Its dependency list is part of its security argument and is kept to
# argument parsing, JSON, and the workspace's single unsafe-bearing crate — no new
# crates.io dependency, so `cargo deny check licenses bans sources` does not move.

[lints]
workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true
serial-nexus-sys.workspace = true
