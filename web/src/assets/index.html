<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serial_nexus console</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <aside id="rail">
      <h1>serial_nexus</h1>
      <nav id="views">
        <button type="button" data-view="console" class="viewbtn active">consoles</button>
        <button type="button" data-view="graph" class="viewbtn">graph</button>
        <button type="button" data-view="editor" class="viewbtn">editor</button>
      </nav>
      <ul id="consoles"></ul>
      <div id="conn" class="disconnected">connecting…</div>
      <!-- Provenance (plan §17.3). A console pane on a screen says nothing about what
           is serving it; this names the client and the daemon it is actually attached
           to, filled from `info` on connect so the version is the daemon's own answer
           rather than a build-time guess baked into the page. -->
      <div id="provenance">serial-nexus-web</div>
    </aside>
    <main id="pane">
      <header id="pane-head">
        <span id="pane-title">select a console</span>
        <span id="pane-lock"></span>
        <span id="pane-drops"></span>
        <!-- The minimal ANSI subset's unknown-sequence tally (§17): the counter is
             §5's honesty on the one surface where the operator cannot otherwise see
             what was thrown away, which it only is once it is on screen. Beside the
             drop badge, because the two report different losses of one stream. -->
        <span id="pane-unknown" title="escape sequences this console's minimal ANSI subset consumed instead of rendering (§17)"></span>
        <span id="pane-storage" class="storage"></span>
        <span id="pane-tools">
          <button id="exportbtn" type="button" disabled>export</button>
          <button id="clearbtn" type="button" disabled>clear</button>
        </span>
      </header>
      <pre id="term" tabindex="0"></pre>
      <!-- §17 clause 3 / §15.66: the steal affordance is a standing, visible preference
           rather than a modal that interrupts the line it is asked about. Checked by
           default, and `checked` is set here rather than in script so the default holds
           from the first paint. The `title` carries what the label has no room for, and
           it sits on the *input* rather than on the wrapping `<label>`: a title on the
           label describes the label, and it is the control whose accessible description
           an assistive technology reads out. -->
      <form id="sendform">
        <input id="sendline" type="text" placeholder="send a line…" autocomplete="off" disabled>
        <label id="stealopt">
          <input id="stealbox" type="checkbox" checked title="When a line is refused because another origin holds the endpoint's write lock, take the lock and send it (§6). Unchecked — or when the refusal names no holder — the refusal is reported in the daemon's words and the line is put back in the box.">
          <span>automatically steal during line write</span>
        </label>
        <button id="sendbtn" type="submit" disabled>send</button>
      </form>
      <!-- The graph and editor views (§17, §15.35). One shell, three views: the
           layout is the contract, and hash routing keeps each bookmarkable
           without the server growing a router. -->
      <section id="graphview" hidden></section>
      <section id="editorview" hidden></section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
