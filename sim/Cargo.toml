[package]
name = "serial-nexus-sim"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Purpose-built test double: PTY/socket doubles that emit machine-readable verdicts (§3)."
publish = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
nix = { workspace = true, features = ["term", "fs", "poll", "ioctl"] }
serial-nexus-sys.workspace = true
# The §15.43 stdin-EOF leash, one implementation for every binary that carries one
# (plan §18 item 79). `serial-nexus-rpc` is where the other cross-binary policy the
# separate processes must agree on already lives (the §10 socket path, item 51), and
# it is `std`-only for this: linking it adds serde + a `nix` uid read, nothing else.
serial-nexus-rpc.workspace = true
libc.workspace = true
anyhow.workspace = true
sha2.workspace = true
# The `mux`/`envelope` modes (phase 5) produce and verify reference-framed
# streams and drive external codec children through the golden-vector battery —
# both speak the shared envelope, so the double links serial-nexus-codec-api directly (§8).
serial-nexus-codec-api.workspace = true
bytes.workspace = true
