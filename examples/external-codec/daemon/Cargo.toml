[package]
name = "acme-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "acme-daemon"
path = "src/main.rs"

# A custom daemon links the two open contracts (§15.26): `serial-nexus-daemon` (the entry
# API — run options, registry, version constants) and `serial-nexus-codec-api` (to name the
# `Codec` trait its factory returns), plus its own codec crate. The paths stand in
# for version pins against a released open core.
[dependencies]
serial-nexus-daemon = { path = "../../../daemon" }
serial-nexus-codec-api = { path = "../../../codec-api" }
acme-codec = { path = "../codec" }
tinymux-codec = { path = "../tinymux" }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
