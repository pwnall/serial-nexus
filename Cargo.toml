[workspace]
resolver = "2"
members = [
    "codec-api",
    "codecs/reference",
    "core",
    "rpc",
    "sim",
    "devprep",
    "sys",
    "doctor",
    "daemon",
    "daemon-bin",
    "ctl",
    "web",
    "itest",
]
# The cargo-fuzz harness (fuzz/) is a separate crate: it needs a nightly toolchain
# and libFuzzer, so it is excluded from the normal workspace build/test (§Phase 8).
# The out-of-tree codec template (examples/external-codec/) is its own workspace by
# design (§15.26): it must build from a *consumer's* position, so it is excluded
# here and built separately by its own validation job (plan §10.3).
exclude = ["fuzz", "examples/external-codec"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwnall/serial-nexus"
authors = ["serial_nexus contributors"]

# Shared dependency versions. Individual crates opt in with `dep.workspace = true`.
# Versions reflect the current registry (mid-2026); see §13 of the design for the
# permissive-only licensing policy that gates every entry here.
[workspace.dependencies]
# Async runtime and I/O.
tokio = { version = "1.53", default-features = false }
futures = "0.3"
bytes = "1"

# Serialization: TOML for configuration files, JSON for the RPC surface (§10).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# CLI parsing (serial-nexus-ctl, serial-nexus-sim, serial-nexus-doctor).
clap = { version = "4", features = ["derive"] }

# Diagnostics.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"

# Serial ports (§13: serial2 chosen over the MPL serialport stack). serial2 opens
# with `O_NONBLOCK | O_NOCTTY` and the daemon drives readiness with its own
# poll(2) loop (§15.18), re-setting O_NONBLOCK itself so that loop's correctness
# never rests on a dependency's open flags (review 37 `37-SER-3`);
# serial2-tokio was dropped during implementation for exposing no accessor for the
# inner fd, which the TIOCEXCL/TIOCGICOUNT ioctls require (§13, §15.1).
serial2 = "0.2"

# POSIX syscalls the daemon needs beyond std (PTY, termios, ioctls, poll).
nix = { version = "0.31", default-features = false }
libc = "0.2"

# Property testing (dev-dependency in serial-nexus-core / serial-nexus-codec-api).
proptest = "1"

# Checksums for the serial-nexus-sim test double's verdicts (§3). Confined to the
# non-shipping test binary; RustCrypto is MIT/Apache (permissive, §13).
sha2 = "0.11"

# Internal crates.
serial-nexus-codec-api = { path = "codec-api" }
serial-nexus-codec-reference = { path = "codecs/reference" }
serial-nexus-core = { path = "core" }
serial-nexus-rpc = { path = "rpc" }
serial-nexus-sys = { path = "sys" }
# default-features off so the thin binary chooses its built-in codec set by
# forwarding features (§8); only serial-nexus-daemon-bin inherits this dependency.
serial-nexus-daemon = { path = "daemon", default-features = false }

# Lints applied to every crate that opts in with `[lints] workspace = true`.
# The unsafe-code policy is expressed per-crate at the source level (§2): pure
# crates `#![forbid(unsafe_code)]`; crates with a `sys` module `#![deny(..)]`
# and localize `#[allow(unsafe_code)]`.
[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

# Optimize dependencies even in dev builds so the data-plane tests run at a
# realistic rate; keep our own crates unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
