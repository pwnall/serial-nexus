[package]
name = "serial-nexus-daemon"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The serial_nexus daemon as an embeddable library (§15.26): boundary nodes, the data-plane runtime, the control plane, the state file, and the codec registry. A custom daemon binary registers its own codecs and calls `run`."

[lib]
name = "serial_nexus_daemon"
path = "src/lib.rs"

[lints]
workspace = true

# Compiled-in codecs sit behind Cargo features so minimal builds can drop what
# they don't need (§8). `with_builtins()` registers each built-in gated on its
# feature; an out-of-tree embedder registers its own factories on top.
[features]
default = ["codec-reference"]
codec-reference = ["dep:serial-nexus-codec-reference"]

[dependencies]
serial-nexus-core.workspace = true
serial-nexus-rpc.workspace = true
serial-nexus-sys.workspace = true
serial-nexus-codec-api.workspace = true
serial-nexus-codec-reference = { workspace = true, optional = true }

tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
futures.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# The pattern wait's matcher (§10, §15.56). Default features carry the `meta`
# searcher, whose every strategy is linear in the haystack.
regex-automata.workspace = true

serial2.workspace = true
nix = { workspace = true, features = ["term", "fs", "poll", "ioctl", "process", "signal", "user"] }
libc.workspace = true

[dev-dependencies]
# Property tests for the pure boundary-supervisor primitives (§16.1 / plan §9.1).
proptest.workspace = true
# The conformance kit's attribute-schema suite (§8 clause 12), run against the
# built-in factories this crate ships — the same suite an out-of-tree codec runs
# from the consumer position (plan §18 item 32).
serial-nexus-codec-api = { workspace = true, features = ["test-support"] }
