# cargo-fuzz harness for serial_nexus' frame and envelope parsers (design plan
# §Phase 8: "fuzzing of frame and envelope parsers ... on top of the existing
# proptest coverage"). This crate is EXCLUDED from the workspace (root Cargo.toml
# `[workspace] exclude`) because it needs a nightly toolchain and libFuzzer:
#
#   cargo install cargo-fuzz
#   cargo +nightly fuzz build                       # build all targets
#   cargo +nightly fuzz run envelope_decode         # fuzz one
#
# The parsers under test are pure, total functions over &[u8] — the ideal fuzz
# surface — and each target asserts a decode/re-encode invariant beyond "no panic".
#
# -----------------------------------------------------------------------------
# Coverage map (review 26, SEC-7: "fuzzing covers only leg-reachable decoders")
# -----------------------------------------------------------------------------
# The first four targets all sit on the serial-nexus-codec-api layer, i.e. they are reachable
# only through a configured `leg` or `exec` codec. Everything an ordinary client
# can reach over the 0600 control socket — with no leg, no peer, no child process
# — was unfuzzed. SEC-7 named four such parsers; here is where each stands.
#
#   1. `serial-nexus-rpc`'s request parser  -> rpc_request_line   ADDED
#      Every byte written to the control socket. The daemon's front door.
#   2. `serial-nexus-rpc`'s base64          -> rpc_base64         ADDED
#      Hand-rolled (§13 permissive-only), and `tap.data`'s byte-exactness rests
#      on it in both directions.
#   3. the control-socket LINE READER (`RequestLines`) -> control_request_lines  ADDED
#      The framer every byte hits before any JSON is parsed, and the one place a
#      hostile client controls both content *and* chunking. Reached through
#      `serial_nexus_daemon::unstable_fuzz_api` — a module that exists only for this and
#      carries no stability promise (§15.26's embeddable surface is unchanged;
#      implementation-notes §3.19 records the terms).
#   4. the web server's HTTP head parser -> web_http_head                      ADDED
#      `serial-nexus-web` gained a library beside its binary so the parser is
#      reachable; same `unstable_fuzz_api` treatment. This one is the most exposed
#      parser in the project: §15.29 sanctions binding beyond loopback, and it runs
#      *before* the token gate. The Origin/Host gate (SEC-3/WEB-7) rides along.
#
# And one target beyond SEC-7's list, for the review's testing item 10:
#
#   5. `GraphConfig` deserialize + validate -> config_load ADDED
#      The `load` verb's payload, reachable with no leg. Two of the review's
#      three worst findings (#2 `replay_ring`, #3 `hostward_buffer`) were plain
#      configuration numbers that walked straight through this parser.
[package]
name = "serial-nexus-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serial-nexus-codec-api = { path = "../codec-api" }
serial-nexus-codec-reference = { path = "../codecs/reference" }
# The leg-free surfaces (SEC-7). `serial-nexus-rpc` is the control socket's stable framing
# and its dependency-free base64; `serial-nexus-core` owns `GraphConfig` and its structural
# validation. Both are already workspace members, so this adds no third-party
# dependency and nothing new for `cargo deny` to weigh (§13).
serial-nexus-rpc = { path = "../rpc" }
serial-nexus-core = { path = "../core" }
# `load` carries JSON, so the config target parses what the RPC actually delivers.
serde_json = "1"
# The two crates whose parsers are only reachable through a deliberately unstable
# `unstable_fuzz_api` module (SEC-7 items 3 and 4). Both are workspace members, so
# again nothing new for `cargo deny` (§13). Depending on them here is the reason
# those modules exist; nothing else may.
serial-nexus-daemon = { path = "../daemon" }
serial-nexus-web = { path = "../web" }
# Both targets drive an `AsyncRead` parser, so they need a runtime to block on.
tokio = { version = "1", features = ["rt", "io-util", "macros"] }

# Fuzz targets are their own binaries; keep them out of docs/tests/benches.
#
# Each `path` below is a **crate root**, which is why every one of these files carries
# `#![forbid(unsafe_code)]` beside its `#![no_main]` (design §16.3: "every raw wrapper
# lives in one crate ... everything else is `#![forbid(unsafe_code)]`"). The attribute
# is per-root and cannot be inherited: this crate is excluded from the workspace, so it
# picks up no `[lints] workspace = true`, and `cargo build --workspace` never compiles
# it — the two facts that let nine roots sit outside the invariant until 2026-08-12,
# when both enforcing gates in `itest/tests/meta_gates.rs` were still skipping this
# directory by name. Those gates now derive these roots from the `[[bin]]` table below
# rather than globbing `fuzz_targets/`, so a target that is registered is a target that
# is checked. Verified to compile with the attribute on stable `cargo check --bins`,
# with and without `--cfg fuzzing`: `fuzz_target!` expands to `#[no_mangle]` and no
# `unsafe`, so the forbid costs the harness nothing.
[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_hello"
path = "fuzz_targets/wire_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reference_demux"
path = "fuzz_targets/reference_demux.rs"
test = false
doc = false
bench = false

# --- leg-free surfaces (SEC-7) -----------------------------------------------
[[bin]]
name = "rpc_request_line"
path = "fuzz_targets/rpc_request_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_base64"
path = "fuzz_targets/rpc_base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_load"
path = "fuzz_targets/config_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_request_lines"
path = "fuzz_targets/control_request_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "web_http_head"
path = "fuzz_targets/web_http_head.rs"
test = false
doc = false
bench = false
