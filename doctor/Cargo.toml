[package]
name = "serial-nexus-doctor"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "serial_nexus capability checker: kernel-behavior probes + environment checks, Markdown/JSON report (design §15.17)."

[[bin]]
name = "serial-nexus-doctor"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serial-nexus-core.workspace = true
# For `DAEMON_NAME`, so the computed socket path names the same daemon the daemon
# does. Workspace-internal and already in the graph, so `cargo deny` does not move.
serial-nexus-rpc.workspace = true
serial-nexus-sys.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json.workspace = true
nix = { workspace = true, features = ["term", "fs", "poll", "ioctl", "user", "feature"] }
libc.workspace = true
serial2.workspace = true
anyhow.workspace = true
