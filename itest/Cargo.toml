[package]
name = "serial-nexus-itest"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform Rust integration-test harness for serial_nexus (replaces the bash validation scripts, §5)."
publish = false

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
libc.workspace = true
# The harness asks `sys` the same question the daemon's `load` asks, rather than
# re-deriving it: `serial_hardware`'s rts-cts test asserts the load REFUSAL on a
# driver that drops CRTSCTS, and it must branch on the predicate `load` consults or
# the two could disagree about the same port (notes §3.67). A workspace-internal
# crate already in the graph, so `cargo deny` does not move.
serial-nexus-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The §17.3 compatibility guard reads the daemon-name constants from their single
# definition rather than repeating a retired spelling (design §15.40).
serial-nexus-rpc.workspace = true
# The packaging example config is structurally validated against the real graph
# validator (plan §12.2 "the example config load-verifies with the map present"),
# with no daemon and no filesystem side effects.
serial-nexus-core = { path = "../core" }
# `meta_codec_authors_doc.rs` checks the author guide's hex vectors against the real
# `encode()` rather than against a copy of them (plan §18 item 37): the point of the
# gate is that the document and the envelope cannot drift, which needs the envelope
# itself. A workspace-internal crate already in the graph, so `cargo deny` does not
# move.
serial-nexus-codec-api.workspace = true
